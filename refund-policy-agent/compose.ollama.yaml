# Add alongside the bundle and optional deterministic sample overlay.
# Docker Desktop can reach the host's existing Ollama through this hostname.
# On other hosts, set OLLAMA_BASE_URL to an address reachable from the container.
services:
  refund-ollama:
    image: astraform/refund-policy-agent:local
    environment:
      REFUND_AGENT_URL: http://refund-ollama:8095
      REFUND_AGENT_MODE: ollama
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      OLLAMA_THINKING: ${OLLAMA_THINKING:-true}
      OLLAMA_CONTEXT_TOKENS: ${OLLAMA_CONTEXT_TOKENS:-65536}
      OLLAMA_OUTPUT_TOKENS: ${OLLAMA_OUTPUT_TOKENS:-32768}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
    restart: unless-stopped
