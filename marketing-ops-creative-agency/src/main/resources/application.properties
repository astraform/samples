spring.application.name=marketing-ops-creative-agency
server.port=${SERVER_PORT:8091}

marketing-ops-creative-agency.a2a.name=${MARKETING_OPS_CREATIVE_AGENCY_NAME:Creative Agency Agent}
marketing-ops-creative-agency.a2a.version=${MARKETING_OPS_CREATIVE_AGENCY_VERSION:0.2.0}
marketing-ops-creative-agency.a2a.description=${MARKETING_OPS_CREATIVE_AGENCY_DESCRIPTION:External creative agency for Marketing Ops A2A routes; LLM-driven advice; deterministic mode is an explicit fixture.}
marketing-ops-creative-agency.a2a.base-url=${MARKETING_OPS_CREATIVE_AGENCY_BASE_URL:http://localhost:${server.port}}
marketing-ops-creative-agency.a2a.documentation-url=${MARKETING_OPS_CREATIVE_AGENCY_DOCUMENTATION_URL:https://astraform.ai/developers.html}
marketing-ops-creative-agency.a2a.blocking-agent-timeout-seconds=${CREATIVE_AGENCY_A2A_AGENT_TIMEOUT_SECONDS:28}
marketing-ops-creative-agency.a2a.blocking-consumption-timeout-seconds=${CREATIVE_AGENCY_A2A_CONSUMPTION_TIMEOUT_SECONDS:5}
marketing-ops-creative-agency.a2a.blocking-reconciliation-timeout-seconds=${CREATIVE_AGENCY_A2A_RECONCILIATION_TIMEOUT_SECONDS:2}
marketing-ops-creative-agency.a2a.max-concurrent-requests=${CREATIVE_AGENCY_A2A_MAX_CONCURRENT_REQUESTS:8}
marketing-ops-creative-agency.a2a.inbound-token=${CREATIVE_AGENCY_A2A_TOKEN:}
marketing-ops-creative-agency.a2a.response-format=${CREATIVE_AGENCY_A2A_RESPONSE_FORMAT:text}

marketing-ops-creative-agency.generation.mode=${CREATIVE_AGENCY_GENERATION_MODE:llm}
marketing-ops-creative-agency.generation.llm.provider-id=${CREATIVE_AGENCY_LLM_PROVIDER_ID:}
marketing-ops-creative-agency.generation.llm.base-url=${CREATIVE_AGENCY_LLM_BASE_URL:}
marketing-ops-creative-agency.generation.llm.auth-type=${CREATIVE_AGENCY_LLM_AUTH_TYPE:bearer}
marketing-ops-creative-agency.generation.llm.api-key=${CREATIVE_AGENCY_LLM_API_KEY:}
marketing-ops-creative-agency.generation.llm.model=${CREATIVE_AGENCY_LLM_MODEL:}
marketing-ops-creative-agency.generation.llm.binding-revision=${CREATIVE_AGENCY_LLM_BINDING_REVISION:}
marketing-ops-creative-agency.generation.llm.allow-insecure-http=${CREATIVE_AGENCY_LLM_ALLOW_INSECURE_HTTP:false}
marketing-ops-creative-agency.generation.llm.structured-output-mode=${CREATIVE_AGENCY_LLM_STRUCTURED_OUTPUT_MODE:json-schema}
marketing-ops-creative-agency.generation.llm.token-limit-parameter=${CREATIVE_AGENCY_LLM_TOKEN_LIMIT_PARAMETER:max-tokens}
marketing-ops-creative-agency.generation.llm.reasoning-effort=${CREATIVE_AGENCY_LLM_REASONING_EFFORT:}
marketing-ops-creative-agency.generation.llm.temperature=${CREATIVE_AGENCY_LLM_TEMPERATURE:}
marketing-ops-creative-agency.generation.llm.top-p=${CREATIVE_AGENCY_LLM_TOP_P:}
marketing-ops-creative-agency.generation.llm.connect-timeout=${CREATIVE_AGENCY_LLM_CONNECT_TIMEOUT:2s}
marketing-ops-creative-agency.generation.llm.read-timeout=${CREATIVE_AGENCY_LLM_READ_TIMEOUT:15s}
marketing-ops-creative-agency.generation.llm.max-attempts=${CREATIVE_AGENCY_LLM_MAX_ATTEMPTS:1}
marketing-ops-creative-agency.generation.llm.retry-backoff=${CREATIVE_AGENCY_LLM_RETRY_BACKOFF:250ms}
marketing-ops-creative-agency.generation.llm.max-output-tokens=${CREATIVE_AGENCY_LLM_MAX_OUTPUT_TOKENS:800}
marketing-ops-creative-agency.generation.llm.max-response-bytes=${CREATIVE_AGENCY_LLM_MAX_RESPONSE_BYTES:131072}
marketing-ops-creative-agency.generation.llm.max-concurrency=${CREATIVE_AGENCY_LLM_MAX_CONCURRENCY:4}
marketing-ops-creative-agency.generation.llm.max-requests-per-minute=${CREATIVE_AGENCY_LLM_MAX_REQUESTS_PER_MINUTE:60}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
