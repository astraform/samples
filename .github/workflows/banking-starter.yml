name: Prepare Banking Starter

on:
  workflow_dispatch:
    inputs:
      starter_version:
        description: "Starter archive version, independent of the platform (for example v0.1.0)"
        required: true
        type: string
      banking_image:
        description: "Public Python bank repository@sha256 digest built from the selected workflow revision"
        required: true
        type: string
      advice_image:
        description: "Public Banking Advice repository@sha256 digest built from the selected workflow revision"
        required: true
        type: string
      postgres_image:
        description: "Approved public PostgreSQL repository@sha256 digest"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the starter and its packaging tool
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up registry inspection
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.35.0
          driver: docker
          use: false

      - name: Prepare the archive from existing public images
        env:
          STARTER_VERSION: ${{ inputs.starter_version }}
          BANKING_IMAGE: ${{ inputs.banking_image }}
          ADVICE_IMAGE: ${{ inputs.advice_image }}
          POSTGRES_IMAGE: ${{ inputs.postgres_image }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          lock = {name: os.environ[variable] for name, variable in (
              ("banking", "BANKING_IMAGE"), ("advice", "ADVICE_IMAGE"), ("postgres", "POSTGRES_IMAGE"))}
          Path(os.environ["RUNNER_TEMP"], "starter-images.json").write_text(json.dumps(lock) + "\n")
          PY
          python3 scripts/package-banking-starter.py \
            --version "$STARTER_VERSION" \
            --source-revision "$GITHUB_SHA" \
            --image-lock "$RUNNER_TEMP/starter-images.json" \
            --output "$RUNNER_TEMP/banking-starter"

      - name: Save the candidate for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: banking-starter-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/banking-starter/*.tar.gz
            ${{ runner.temp }}/banking-starter/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Record the preparation boundary
        run: |
          printf 'Prepared from samples commit `%s`.\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'This workflow does not build images, change registry access or publish a release. Review the archive and checksum before separately approved publication.' >> "$GITHUB_STEP_SUMMARY"
