spring.application.name=java-spring-banking
server.port=8094
management.endpoints.web.exposure.include=health,info

# The bank-owned database and MCP surface are opt-in alongside the legacy
# remote-domain snapshot profile. No account database is created by Astraform.
banking.backend.enabled=${BANKING_BACKEND_ENABLED:false}
banking.backend.jdbc-url=${BANKING_DB_URL:jdbc:postgresql://localhost:5432/banking}
banking.backend.username=${BANKING_DB_USERNAME:banking}
banking.backend.password=${BANKING_DB_PASSWORD:banking}
banking.backend.maximum-pool-size=${BANKING_DB_POOL_SIZE:8}

# Keep checkpoint compatibility unless the partner explicitly chooses DB event ownership.
astraform.native-simulation.enabled=${ASTRAFORM_NATIVE_SIMULATION_ENABLED:false}
astraform.native-simulation.profile=${ASTRAFORM_NATIVE_SIMULATION_PROFILE:remote-domain.native-state-transform.v1}
