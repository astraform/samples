name: astraform-python-banking

services:
  python-banking-db:
    image: postgres:16
    environment:
      POSTGRES_DB: banking_python
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
    ports:
      - "127.0.0.1:${PYTHON_BANKING_DB_HOST_PORT:-5545}:5432"
    volumes:
      - python-banking-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking_python"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  python-banking-data:
