[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
build = [
  "setuptools==83.0.0",
  "wheel==0.47.0",
]
release = [
  "pyyaml==6.0.3",
]

[project]
name = "banking-remote-domain-python"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Python banking reference implementation for remote-domain.v1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "astraform-sdk[fastapi]==0.3.5",
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.32,<1.0",
  "psycopg[binary,pool]>=3.2,<4",
  "mcp>=1.26,<2",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
banking_remote_domain_python = ["population-catalogs/*.json", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
